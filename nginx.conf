server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione gzip per velocizzare il caricamento di JS e CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Gestione Single Page Application (React Router):
    # Qualsiasi rotta (es. /issues, /login) viene reindirizzata a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache per gli asset statici generati da Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

